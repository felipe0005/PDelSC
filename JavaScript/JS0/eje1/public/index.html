<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-sky-950">
    <div
      id="alerta"
      class="fixed top-0 left-4 translate-y-[-50px] transition duration-300 border-2 px-24 py-2 rounded-sm"
    >
      <p id="mensaje" class="font-semibold"></p>
    </div>
    <form
      id="form"
      class="border-2 rounded-xl bg-gray-100 border-gray-100 w-64 h-70 grid justify-items-center place-content-center shadow-xl"
    >
      <h1 class="text-4xl font-semibold">Formulario</h1>
      <input
        type="text"
        id="name"
        placeholder="Nombre"
        class="p-2 bg-gray-300 opacity-80 rounded-lg mt-4 placeholder:italic focus:outline-emerald-400"
      />
      <input
        type="text"
        id="surname"
        placeholder="Apellido"
        class="p-2 bg-gray-300 opacity-80 rounded-lg mt-2 placeholder:italic focus:outline-none"
      />
      <button
        type="submit"
        class="border-2 border-emerald-500 rounded-lg bg-emerald-500 h-10 w-20 text-white font-semibold mt-4 transition duration-300 hover:bg-gray-100 hover:border-emerald-500 hover:text-emerald-500"
      >
        enviar
      </button>
    </form>

    <div
      id="usuarios"
      class="flex flex-col items-center w-full max-w-[600px] mt-10"
    >
      <h2 class="text-center font-bold text-2xl mb-5">Usuarios</h2>
      <ul
        id="lista"
        class="bg-violet-200 border-2 border-b-0 border-violet-300 rounded-sm w-full"
      ></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
