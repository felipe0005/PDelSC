<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Herramientas</title>
  </head>
  <body class="flex flex-col items-center px-4 bg-sky-950">
    <section>
      <h1 class="text-3xl text-white font-bold mb-2">Formulario</h1>
      <form
        id="form"
        class="border-2 rounded-xl bg-gray-100 border-gray-100 w-64 h-70 grid justify-items-center place-content-center shadow-xl"
      >
        <input
          name="jugador"
          id="jugador"
          type="text"
          placeholder="jugador"
          class="mt-5 w-48 p-2 bg-gray-200 rounded-lg"
        />
        <input
          name="precio"
          id="precio"
          type="number"
          placeholder="precio"
          class="mt-3 w-48 p-2 bg-gray-200 rounded-lg"
        />
        <input
          name="objeto"
          id="objeto"
          type="text"
          placeholder="objeto"
          class="mt-3 w-48 p-2 bg-gray-200 rounded-lg"
        />
        <input
          name="apellido"
          id="apellido"
          type="text"
          placeholder="apellido"
          class="mt-3 w-48 p-2 bg-gray-200 rounded-lg"
        />
        <button
          type="submit"
          class="m-5 border-2 border-sky-500 rounded-lg w-24 p-2 bg-sky-500 text-white hover:bg-white hover:text-sky-500 trasnsition duration-300"
        >
          enviar
        </button>
      </form>
    <div
      id="usuarios"
      class="flex flex-col items-center w-full max-w-[700px] mt-10"
    >
      <h2 class="text-center font-bold text-2xl mb-5">Usuarios</h2>

      <div class="overflow-x-auto w-full mb-6">
        <table
          class="table-auto w-full border-collapse border border-violet-300 bg-violet-100 rounded-sm shadow-md"
        >
          <thead>
            <tr class="bg-violet-300 text-violet-800">
              <th class="border border-violet-300 px-2 py-2">Jugador</th>
              <th class="border border-violet-300 px-2 py-2">apellido</th>
              <th class="border border-violet-300 px-2 py-2">Precio</th>
              <th class="border border-violet-300 px-2 py-2">objeto</th>
            </tr>
          </thead>
          <tbody id="lista">
           
          </tbody>
        </table>
      </div>
    </div>

    <div id="alerta" class="hidden rounded-sm px-24 py-2">
      <p id="texto" class="">Mensaje</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js"></script>
  </body>
</html>
