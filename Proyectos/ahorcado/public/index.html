<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 class="text-4xl font-bold">AHORCADO 💀</h1>

    <button id="btnJugar" class="border-2 rounded-lg p-2 font-bold my-3">
      JUGAR
    </button>

    <div id="game" style="display: none" class="mt-3">
      <input
        type="text"
        name="letras"
        placeholder="Letra"
        id="letra"
        maxlength="1"
        class="p-2 rounded-lg border-2"
      />
      <button
        id="btnVerificar"
        type="submit"
        class="border-2 rounded-lg p-2 font-bold"
      >
        verfiicar
      </button>
      <p id="palabraOculta" class="mt-2 text-5xl"></p>
    </div>

    <script src="/game/functions.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </body>
</html>
